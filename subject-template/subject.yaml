schema_version: 1

subject:
  id: TODO                 # 영문 소문자 (예: math, english, social)
  name_ko: TODO            # 예: 수학과
  name_en: TODO
  curriculum: 2022 개정 교육과정
  school_level: 고등학교

# -----------------------------------------------------------------------------
# 1. 성취기준 코드 체계
#    ★ 반드시 실제 코드를 확인하고 쓸 것. 과목 유형마다 형식이 다를 수 있다.
#      (국어과의 경우 공통과목은 하이픈 2개, 선택과목은 1개였다)
# -----------------------------------------------------------------------------
standard_code:
  pattern: 'TODO'          # 예: '^\[(?P<band>\d{2})(?P<course>[가-힣]+\d?)-?(?P<area>\d{2})-(?P<serial>\d{2})\]$'
  examples:                # 과목 유형마다 최소 1개씩. validate 가 이걸로 pattern 을 검증한다.
    - 'TODO'
  parts:
    band:   학교급·학년 표시
    course: 과목 약칭 토큰
    area:   영역 순번
    serial: 영역 내 성취기준 순번

# -----------------------------------------------------------------------------
# 2. 과목 목록
#    level_system    : 성취수준 진술 체계 (5 또는 3). KICE 보급본에서 확인.
#    grading_scale   : 성취도 평정 단계 (5 또는 3). 학업성적관리 시행지침에서 확인.
#                      ★ 과목 유형이 아니라 '교과(군)'가 결정한다. core/asa-rules.md §2 참조.
#    rank_grade      : 석차등급 산출 단계. 미산출이면 null.
#    has_area_levels : 영역별 성취수준 개발 여부. ★ 과목마다 실제 자료를 열어 확인할 것.
#                      기준은 공통/선택이 아니라 '내용 영역 구분의 유무'다.
# -----------------------------------------------------------------------------
courses:
  - id: TODO
    code_token: TODO
    code_example: 'TODO'
    name: TODO
    type: common           # common | general_elective | career_elective | fusion_elective
    level_system: 5
    grading_scale: 5
    rank_grade: 5
    has_area_levels: true
    areas:
      "01": TODO

# -----------------------------------------------------------------------------
# 3. 시도교육청 지침 (교과와 독립된 축)
# -----------------------------------------------------------------------------
jurisdiction:
  id: TODO
  name: TODO
  source: TODO
  rules:
    selected_response_choices: 5
    constructed_response_types: [TODO]

# -----------------------------------------------------------------------------
# 4. 평가 유형별 관행
#    ★ target_* 값은 제도 규칙이다. 교과가 바꿀 수 없다. (core/asa-rules.md §4)
# -----------------------------------------------------------------------------
assessment:
  paper:
    selected_response:
      target_correct_rate: 0.66
    constructed_response:
      target_full_mark_prob: 0.50
  performance:
    types: [논술, 구술·발표, 토의·토론, 프로젝트, 실험·실습, 포트폴리오, 기타]
    supplementary: [교사 관찰 및 기록, 자기평가, 동료평가]

# -----------------------------------------------------------------------------
# 5. 원자료 출처  (scripts/build_refs.py 가 참조)
#    ★ 저작권 원문은 저장소에 넣지 않는다. 각자 로컬에 두고 빌드한다.
#    ★ .hwp 를 정본으로, .pdf 를 교차검증용으로.
# -----------------------------------------------------------------------------
sources:
  standards:
    - id: TODO
      title: TODO
      publisher: 한국교육과정평가원
      primary: TODO.hwp
      crosscheck: TODO.pdf
      covers: [TODO]
      contains: [standard_levels]
  exemplars: []

# -----------------------------------------------------------------------------
# 6. 교과 특수 문서
# -----------------------------------------------------------------------------
documents:
  difficulty_levers: difficulty-levers.md
  item_conventions:  item-conventions.md
  misconceptions:    misconceptions.md
