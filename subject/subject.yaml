# -----------------------------------------------------------------------------
# 3. 시도교육청 지침
#    교과와 독립된 축이다. 다른 시도로 옮길 때는 이 블록만 교체한다.
# -----------------------------------------------------------------------------
jurisdiction:
  id: gyeonggi
  name: 경기도교육청
  source: 경기도 학업성적관리 시행지침
  source_year: null          # ★ 지침 연도. 해마다 개정되므로 반드시 확인해 적을 것
  rules:
    selected_response_choices: 5      # '선택형'은 오지선다로 출제
    # ★ 시도마다 다르다. 국가 예시 평가도구에는 서술형·단답형·완성형도 들어 있으므로
    #   여기 적힌 값을 교과 공통 사실로 읽으면 안 된다. 소속 시도 지침을 확인해 채울 것.
    constructed_response_types: [논술형]  # 경기: '서답형'은 논술형만 사용
    essay_expansion_encouraged: true  # 논술형 평가 확대 권장
    neis_label_for_essay: 서답형        # 나이스 표기

  # ★ 반영 비율은 시도마다 다르고 해마다 바뀐다. 값을 넣지 않은 채 두었다.
  #   스킬은 null 이면 추측하지 말고 사용자에게 묻는다.
  #   예) 경기도교육청 2026 개정: 수행평가 하한 40%→30%, 논술형 고 35%→30%
  #   본인 학교가 속한 시도의 해당 연도 시행지침을 확인해 채울 것.
  ratios:
    performance_min_percent: null     # 수행평가 반영 비율 하한
    essay_min_percent: null           # 논술형 평가 비율 하한
    note: 소속 시도교육청 학업성적관리 시행지침에서 확인할 것

# -----------------------------------------------------------------------------
# 4. 평가 유형별 관행
#    target_* 값은 core/asa-rules.md 의 제도 규칙과 일치해야 한다(엔진이 교차검증).
# -----------------------------------------------------------------------------
assessment:
  paper:
    selected_response:
      target_correct_rate: 0.66       # 목표 수준 MCP의 약 2/3가 정답
    constructed_response:
      target_full_mark_prob: 0.50     # 목표 수준 학생이 만점 받을 확률 50%
  performance:
    types:
      - 논술
      - 구술·발표
      - 토의·토론
      - 프로젝트
      - 실험·실습
      - 포트폴리오
      - 기타
    supplementary: [교사 관찰 및 기록, 자기평가, 동료평가]

# -----------------------------------------------------------------------------
# 5. 원자료 출처
#    scripts/build_refs.py 가 subject/data/ 를 만들 때 참조한다.
#    ★ 저작권 있는 원문은 저장소에 포함하지 않는다. 사용자가 로컬에 두고 빌드한다.
#    ★ .hwp 를 정본으로, .pdf 를 교차검증용으로 쓴다.
#      (PDF는 표가 페이지를 넘을 때 셀이 깨진다 — 공통 보급본 '읽기' 영역별 성취수준 E에서 확인)
# -----------------------------------------------------------------------------
sources:
  standards:
    - id: kice_common
      title: 2022 개정 교육과정에 따른 고등학교 국어과 공통과목 성취수준
      publisher: 한국교육과정평가원
      year: 2024
      primary: 6. 국어과 성취수준.hwp
      crosscheck: 6. 국어과 성취수준.pdf
      covers: [gongguk1, gongguk2]
      contains: [standard_levels, area_levels, exemplar_items]

    - id: kice_elective
      title: 2022 개정 교육과정에 따른 고등학교 국어과 선택과목 성취수준 (현장 보급본)
      publisher: 한국교육과정평가원
      year: 2025
      primary: 1. 국어과 선택과목 성취수준 현장 보급본.hwp
      crosscheck: 1. 국어과 선택과목 성취수준 현장 보급본.pdf
      covers: [hwaeon, dokjak, munhak, jutam, munyeong, jikui, dokto, maeui, eontam]
      contains: [standard_levels, exemplar_items]

  methodology:
    - id: kice_common_report
      title: 국어과 공통과목 성취수준 개발 연구 최종보고서
      primary: 7. 국어과 공통과목 성취수준 개발 연구 최종보고서.pdf
      use: 성취수준 개발 원리·판단 근거의 출처

    - id: kice_elective_report
      title: 2022 개정 교육과정에 따른 고등학교 국어과 선택과목 성취수준 개발 연구 최종보고서
      primary: '1. 2022 개정 교육과정에 따른 고등학교 국어과 선택과목  성취수준 개발 연구 최종보고서(평가원용).pdf'
      use: 성취수준 개발 원리·판단 근거의 출처

  exemplars:
    - id: gyeonggi_standardized
      title: 2025 경기 성취평가 표준화 평가도구 (공통국어)
      publisher: 경기도교육청
      year: 2025
      primary: 1_[공통국어] 2025 경기 성취평가 표준화 평가도구(예시).pdf
      covers: [gongguk1, gongguk2]
      contains: [item_cards, mcp_statements, performance_tasks, rubrics, cut_scores]
      note: 성취수준별 A~E 표적 문항 세트의 정본. 난이도 레버 도출의 근거 자료.

    - id: stas
      title: KICE 학생평가지원포털
      url: https://stas.moe.go.kr
      auth: .env (STAS_USER_ID / STAS_PASSWORD)
      fetch: scripts/stas_fetch.py
      contains: [performance_tools, essay_tools, rubrics, formative_tools]

