# =============================================================================
#  교과 팩 계약 (Subject Pack Contract)
# =============================================================================
#  이 파일은 asa-skills 엔진이 교과를 인식하는 유일한 진입점이다.
#  다른 교과로 포크할 때는 이 파일과 같은 디렉터리의 문서 3종만 교체하면 되며,
#  core/ 와 skills/ 는 절대 수정하지 않는다.  →  FORKING.md 참조
#
#  스키마 검증:  python scripts/validate_subject.py
# =============================================================================

schema_version: 1

subject:
  id: korean
  name_ko: 국어과
  name_en: Korean Language Arts
  curriculum: 2022 개정 교육과정
  school_level: 고등학교

# -----------------------------------------------------------------------------
# 1. 성취기준 코드 체계
#    포크 시 반드시 교체. 엔진은 이 정규식으로 성취기준 코드를 파싱·검증한다.
# -----------------------------------------------------------------------------
standard_code:
  # ★ 공통과목과 선택과목의 하이픈 위치가 다르다. 하나의 정규식으로 둘 다 받는다.
  #
  #   공통과목  [10공국1-01-01]  →  band=10  course=공국1  area=01  serial=01   (하이픈 2개)
  #   선택과목  [12화언01-03]    →  band=12  course=화언   area=01  serial=03   (하이픈 1개)
  #
  #   선택과목은 과목 토큰과 영역 번호가 붙어 있다. 영역이 01 하나뿐이기 때문이다.
  pattern: '^\[(?P<band>\d{2})(?P<course>[가-힣]+\d?)-?(?P<area>\d{2})-(?P<serial>\d{2})\]$'
  examples:
    - '[10공국1-01-01]'
    - '[10공국2-06-02]'
    - '[12화언01-03]'
    - '[12언탐01-05]'
  parts:
    band:   학교급·학년 표시 (10=고1 공통과목, 12=고2~3 선택과목)
    course: 과목 약칭 토큰 (아래 courses[].code_token 과 일치)
    area:   영역 순번
    serial: 영역 내 성취기준 순번

# -----------------------------------------------------------------------------
# 2. 과목 목록
#    level_system   : 성취수준 진술 체계. KICE 보급본에서 직접 확인함(11과목 전부 5수준).
#    grading_scale  : 성취도 평정 단계(5 또는 3). 학교생활기록부 기재요령 기준.
#    type           : common(공통) / elective(선택).
#                     ★ grading_scale 만으로는 성취도 표가 정해지지 않는다. type 이 함께 필요하다.
#                       같은 5단계여도 공통과목 E는 40~60%, 선택과목 E는 60% 미만이다.
#                       네 개의 표와 판별 규칙은 core/asa-rules.md §2 참조.
#    has_area_levels: 영역별 성취수준 개발 여부.
#                     ★ 기준은 공통/선택이 아니라 '내용 영역 구분의 유무'다.
#                       국어과는 선택과목 9종 모두 영역 구분이 없어 false 이지만,
#                       다른 교과는 선택과목에도 영역별 성취수준이 있을 수 있다.
#                       false 인 과목은 학기 단위 성취수준을 성취기준별 성취수준만으로 구성한다.
# -----------------------------------------------------------------------------
courses:
